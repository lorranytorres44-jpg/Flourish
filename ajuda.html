<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('tdl_theme');if(t)t=t.replace(/"/g,'');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Ajuda — Flowrish</title>
<meta name="description" content="Fale com a equipe da Flowrish — envie sua dúvida, sugestão ou problema.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>
<div id="navbar-root"></div>

<main class="container" style="max-width:560px;padding-top:calc(var(--header-h) + 48px);padding-bottom:64px;">
  <h1>Central de ajuda</h1>
  <p class="text-muted">Tem uma dúvida, sugestão ou problema? Escreva pra gente — respondemos por e-mail.</p>

  <form id="ajudaForm" class="card" style="padding:28px;margin-top:24px;">
    <div class="field">
      <label for="ajudaNome">Nome</label>
      <input class="input" type="text" id="ajudaNome" required placeholder="Seu nome">
    </div>
    <div class="field">
      <label for="ajudaEmail">E-mail</label>
      <input class="input" type="email" id="ajudaEmail" required placeholder="voce@email.com">
    </div>
    <div class="field">
      <label for="ajudaMensagem">Mensagem</label>
      <textarea class="input" id="ajudaMensagem" rows="5" required placeholder="Descreva sua dúvida ou problema..."></textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" id="ajudaSubmitBtn">Enviar mensagem</button>
  </form>
</main>

<div id="footer-root"></div>
<script type="module" src="js/ajuda.js"></script>
</body>
</html>
