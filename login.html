<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Flowrish</title>
<meta name="description" content="Entre na sua conta Flowrish para trocar livros com outros leitores.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Fredoka:wght@700&family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
<div class="auth-wrap auth-flor">
  <a href="index.html" class="auth-visual" aria-label="Flowrish — voltar para o início">
    <span class="auth-deco" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    <span class="auth-logo" aria-hidden="true">Fl<img src="assets/flor-logo.svg" alt="">wrish</span>
  </a>
  <div class="auth-form-side">
    <div class="auth-box">
      <h1 class="auth-title">Seja bem vindo!</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
          <label for="senha">Senha</label>
          <input class="input" type="password" id="senha" name="senha" required autocomplete="current-password">
        </div>
        <div class="auth-forgot-row">
          <button type="button" class="auth-link-btn" id="forgotBtn">Esqueci a senha</button>
        </div>
        <button type="submit" class="auth-submit">Entrar</button>
      </form>

      <div class="auth-or">Ou</div>
      <button type="button" class="btn-google" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.2-2.2H12v4.2h6.5c-.1 1-.9 2.7-2.6 3.8l4 3.1c2.4-2.2 3.6-5.4 3.6-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.8l-4-3.1c-1.1.7-2.4 1.1-3.9 1.1-3 0-5.6-2-6.5-4.8l-4.1 3.2C3.5 21.5 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.5 14.4c-.2-.7-.4-1.4-.4-2.4s.1-1.6.4-2.4L1.4 6.4C.5 8.1 0 10 0 12s.5 3.9 1.4 5.6l4.1-3.2z"/><path fill="#EA4335" d="M12 4.8c1.7 0 3.2.6 4.4 1.7l3.3-3.3C17.9 1.2 15.2 0 12 0 7.4 0 3.5 2.5 1.4 6.4l4.1 3.2c.9-2.8 3.5-4.8 6.5-4.8z"/></svg>
        Entrar com Google
      </button>
      <p class="auth-foot-link">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
  </div>
</div>

<script type="module" src="js/login.js"></script>
</body>
</html>
