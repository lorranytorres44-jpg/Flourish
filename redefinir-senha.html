<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){document.documentElement.setAttribute('data-theme','light');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Flowrish</title>
<meta name="description" content="Defina uma nova senha para sua conta Flowrish.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><text y=%2220%22 font-size=%2220%22>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-visual">
    <h2>Quase lá!</h2>
    <p>Escolha uma nova senha forte para continuar cuidando da sua estante de trocas.</p>
  </div>
  <div class="auth-form-side">
    <div class="auth-box">
      <a href="login.html" class="back-home">← Voltar para o login</a>
      <h1 style="font-size:1.8rem;">Redefinir senha</h1>
      <p class="text-muted" id="redefinirSubtitle">Verificando o link...</p>

      <form id="redefinirForm" novalidate style="display:none;">
        <div class="field">
          <label for="novaSenha">Nova senha</label>
          <input class="input" type="password" id="novaSenha" required minlength="6" placeholder="Mínimo 6 caracteres">
          <div class="password-strength"><span id="strengthBar"></span></div>
        </div>
        <div class="field">
          <label for="confirmarNovaSenha">Confirmar nova senha</label>
          <input class="input" type="password" id="confirmarNovaSenha" required minlength="6" placeholder="Repita a senha">
          <p class="hint" id="confirmarNovaSenhaHint" style="display:none;color:var(--danger);">As senhas não coincidem.</p>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Redefinir senha</button>
      </form>

      <div id="redefinirInvalido" style="display:none;">
        <a href="login.html" class="btn btn-secondary btn-block">Voltar para o login</a>
      </div>
    </div>
  </div>
</div>

<script type="module" src="js/redefinir-senha.js"></script>
</body>
</html>
