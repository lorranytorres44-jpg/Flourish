<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>(function(){var t=localStorage.getItem('tdl_theme');if(t)t=t.replace(/"/g,'');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca — Flowrish</title>
<meta name="description" content="Explore centenas de livros disponíveis para troca. Filtre por gênero, cidade, estado de conservação e mais.">
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages/biblioteca.css">
</head>
<body>
<div id="navbar-root"></div>

<header class="library-header">
  <div class="container">
    <h1 style="margin-bottom:6px;">Biblioteca</h1>
    <p class="mb-0">Todos os livros disponíveis para troca na comunidade, em um só lugar.</p>
  </div>
</header>

<main class="container">
  <div class="library-layout">
    <aside class="card filters-panel" id="filtersPanel" aria-label="Filtros de busca">
      <h3>Filtros</h3>

      <div class="field">
        <label for="fNome">Título ou autor</label>
        <input class="input" type="search" id="fNome" placeholder="Buscar...">
      </div>

      <div class="filter-group">
        <span class="group-label">Gênero</span>
        <div class="filter-chip-list" id="fGenero"></div>
      </div>

      <div class="filter-group">
        <span class="group-label">Estado de conservação</span>
        <div class="filter-chip-list" id="fConservacao"></div>
      </div>

      <div class="filter-group">
        <span class="group-label">Origem</span>
        <div class="filter-chip-list" id="fOrigem">
          <button class="filter-chip" data-value="Nacional">Nacional</button>
          <button class="filter-chip" data-value="Internacional">Internacional</button>
        </div>
      </div>

      <div class="field">
        <label for="fEstado">Estado</label>
        <select class="input" id="fEstado">
          <option value="">Todos os estados</option>
        </select>
      </div>

      <button class="btn btn-secondary btn-block btn-sm" id="clearFilters">Limpar filtros</button>
    </aside>

    <section>
      <div class="results-toolbar">
        <p class="results-count mb-0" id="resultsCount"></p>
        <div class="flex gap-12 items-center">
          <button class="btn btn-secondary btn-sm filters-toggle-mobile" id="toggleFiltersMobile">Filtros</button>
          <select class="input" id="ordenacao" style="width:auto;" aria-label="Ordenar por">
            <option value="recentes">Mais recentes</option>
            <option value="populares">Mais populares</option>
            <option value="az">Ordem alfabética dos títulos (A-Z)</option>
            <option value="az-autor">Ordem alfabética dos autores (A-Z)</option>
          </select>
        </div>
      </div>
      <div class="book-grid" id="bookGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="emoji">📭</div>
        <h3>Nenhum livro encontrado</h3>
        <p>Tente ajustar os filtros de busca.</p>
      </div>
    </section>
  </div>
</main>

<div id="footer-root"></div>
<script type="module" src="js/biblioteca.js"></script>
</body>
</html>
