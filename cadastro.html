<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — Flowrish</title>
<meta name="description" content="Crie sua conta gratuita na Flowrish e troque livros com outros leitores.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Fredoka:wght@700&family=Oswald:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
<div class="auth-wrap auth-flor">
  <a href="index.html" class="auth-visual" aria-label="Flowrish — voltar para o início">
    <span class="auth-deco" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span>
    <span class="auth-logo" aria-hidden="true">Fl<img src="assets/flor-logo.svg" alt="">wrish</span>
  </a>
  <div class="auth-form-side">
    <div class="auth-box">
      <h1 class="auth-title">Crie sua conta</h1>

      <form id="cadastroForm" novalidate>
        <div class="field">
          <label for="nome">Nome</label>
          <input class="input" type="text" id="nome" required autocomplete="name">
        </div>
        <div class="field">
          <label for="cadEmail">Email</label>
          <input class="input" type="email" id="cadEmail" required autocomplete="email">
          <p class="hint" id="emailHint" style="display:none;color:var(--danger);">O email precisa ter um @.</p>
        </div>
        <div class="field">
          <label for="cadTelefone">Número do WhatsApp</label>
          <input class="input" type="tel" id="cadTelefone" inputmode="numeric" maxlength="15" placeholder="(11) 99999-9999" required autocomplete="tel-national">
        </div>
        <div class="field">
          <label for="cadSenha">Senha</label>
          <input class="input" type="password" id="cadSenha" required minlength="6" autocomplete="new-password">
          <div class="password-strength"><span id="strengthBar"></span></div>
        </div>
        <div class="field">
          <label for="cadConfirmarSenha">Confirme a senha</label>
          <input class="input" type="password" id="cadConfirmarSenha" required minlength="6" autocomplete="new-password">
          <p class="hint" id="confirmarSenhaHint" style="display:none;color:var(--danger);">As senhas não coincidem.</p>
        </div>
        <label class="auth-terms">
          <input type="checkbox" id="confirmaIdade" required>
          <span>Tenho 16 anos ou mais.</span>
        </label>
        <label class="auth-terms">
          <input type="checkbox" id="aceiteTermos" required>
          <span>Li e concordo com os <a href="assets/termos.pdf" target="_blank" rel="noopener">termos de uso</a> e <a href="assets/termos.pdf#page=9" target="_blank" rel="noopener">política de privacidade</a>.</span>
        </label>
        <button type="submit" class="auth-submit">Cadastrar</button>
      </form>

      <p class="auth-foot-link">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </div>
</div>

<script type="module" src="js/cadastro.js"></script>
</body>
</html>
