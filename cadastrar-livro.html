<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anunciar Livro — Flowrish</title>
<meta name="description" content="Cadastre um livro para troca informando o ISBN ou preenchendo manualmente.">
<meta name="theme-color" content="#4B4C33">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/pages/home.css">
<link rel="stylesheet" href="css/pages/cadastrar-livro.css">
</head>
<body class="home-page">
<div id="navbar-root"></div>

<main class="anunciar-page">
  <div class="container form-page">
    <h1 class="anunciar-title">Anuncie seu livro!</h1>

    <div class="anunciar-card">
      <div id="isbnSection">
        <label class="anunciar-label" for="isbnInput">Busque com o ISBN</label>
        <div class="isbn-lookup">
          <input class="anunciar-input" type="text" id="isbnInput" placeholder="Ex: 1234567891011">
          <button type="button" class="anunciar-btn" id="isbnSearchBtn">Buscar</button>
        </div>
        <p class="anunciar-hint" id="isbnStatus"></p>
        <div class="book-preview" id="bookPreview">
          <img id="previewCapa" src="" alt="Capa encontrada">
          <div>
            <strong id="previewTitulo"></strong>
            <p class="mb-0" id="previewAutor"></p>
            <p class="mb-0 preview-meta" id="previewMeta"></p>
            <button type="button" class="anunciar-btn anunciar-btn-sm" id="removeCapaBtn">Remover capa encontrada</button>
          </div>
        </div>
      </div>

      <form id="bookForm">
        <div class="a-field">
          <label class="anunciar-label" for="titulo">Título*</label>
          <input class="anunciar-input" type="text" id="titulo" required>
        </div>
        <div class="a-field">
          <label class="anunciar-label" for="autor">Autor*</label>
          <input class="anunciar-input" type="text" id="autor" required>
        </div>
        <div class="a-row">
          <div class="a-field">
            <label class="anunciar-label" for="editora">Editora</label>
            <input class="anunciar-input" type="text" id="editora">
          </div>
          <div class="a-field">
            <label class="anunciar-label" for="edicao">Edição</label>
            <input class="anunciar-input" type="text" inputmode="numeric" id="edicao">
          </div>
        </div>
        <div class="a-row">
          <div class="a-field">
            <label class="anunciar-label" for="ano">Ano da edição</label>
            <input class="anunciar-input" type="number" id="ano" min="1400" max="2100">
          </div>
          <div class="a-field">
            <label class="anunciar-label" for="paginas">Número de páginas</label>
            <input class="anunciar-input" type="number" id="paginas" min="1">
          </div>
        </div>
        <div class="a-row">
          <div class="a-field">
            <label class="anunciar-label" id="generoLabel">Gênero*</label>
            <div class="custom-select">
              <button type="button" class="anunciar-input custom-select-trigger" id="generoTrigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="generoLabel">
                <span id="generoTriggerText"></span>
                <svg width="13" height="11" viewBox="0 0 12 10" aria-hidden="true"><path d="M0 0h12L6 10z" fill="currentColor"/></svg>
              </button>
              <div class="custom-select-panel" id="generoPanel" role="listbox" aria-multiselectable="true"></div>
            </div>
          </div>
          <div class="a-field">
            <label class="anunciar-label" for="nacionalidade">Nacionalidade*</label>
            <select class="anunciar-input anunciar-select" id="nacionalidade" required>
              <option value="" disabled selected></option>
              <option value="Nacional">Nacional</option>
              <option value="Internacional">Internacional</option>
            </select>
          </div>
        </div>
        <div class="a-field">
          <label class="anunciar-label" for="sinopse">Sinopse*</label>
          <textarea class="anunciar-input anunciar-textarea" id="sinopse" rows="1" required></textarea>
        </div>

        <hr class="anunciar-divider">

        <div class="a-row">
          <div class="a-field">
            <label class="anunciar-label" for="estadoConservacao">Estado de conservação*</label>
            <select class="anunciar-input anunciar-select" id="estadoConservacao" required><option value="" disabled selected></option></select>
          </div>
          <div class="a-field">
            <label class="anunciar-label" for="tempoUso">Tempo de uso</label>
            <input class="anunciar-input" type="text" id="tempoUso">
          </div>
        </div>
        <div class="a-field">
          <label class="anunciar-label" for="observacoes">Observações*</label>
          <textarea class="anunciar-input anunciar-textarea" id="observacoes" rows="1"></textarea>
        </div>
        <label class="anunciar-check">
          <input type="checkbox" id="semDanificacoes">
          <span>Sem danificações relevantes</span>
        </label>

        <hr class="anunciar-divider">

        <p class="anunciar-label">Adicione fotos do seu livro</p>
        <div class="photo-upload-grid" id="photoGrid">
          <label class="photo-slot photo-add" for="photoInput" aria-label="Adicionar fotos"><span aria-hidden="true">+</span><input type="file" id="photoInput" accept="image/*" multiple class="visually-hidden"></label>
        </div>

        <button type="submit" class="anunciar-btn anunciar-submit">Publicar</button>
      </form>
    </div>
  </div>
</main>

<div id="footer-root"></div>
<script type="module" src="js/cadastrar-livro.js"></script>
</body>
</html>
