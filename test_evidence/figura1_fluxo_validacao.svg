<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feOffset dx="0" dy="3" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B6B50"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B91C1C"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#FAF8F5" rx="12"/>
  <rect x="40" y="25" width="920" height="50" fill="#2E4A35" rx="8" filter="url(#shadow)"/>
  <text x="500" y="56" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    FLUXO SISTÊMICO DE VALIDAÇÕES DE DADOS — FLOWRISH MVP
  </text>

  <g filter="url(#shadow)">
    <rect x="350" y="105" width="300" height="65" fill="#FFFFFF" stroke="#4A7C59" stroke-width="2" rx="8"/>
    <text x="500" y="132" fill="#2E4A35" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Entrada de Dados pelo Usuário</text>
    <text x="500" y="152" fill="#555555" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Formulários: Login, Cadastro, Livro, Troca</text>
  </g>

  <line x1="500" y1="170" x2="500" y2="210" stroke="#4B6B50" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <polygon points="500,215 720,270 500,325 280,270" fill="#F4F8F4" stroke="#4A7C59" stroke-width="2"/>
    <text x="500" y="263" fill="#2E4A35" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2. Validações Sintáticas</text>
    <text x="500" y="282" fill="#444444" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Campos obrigatórios, formato e-mail,</text>
    <text x="500" y="297" fill="#444444" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">força de senha, regex CEP, fotos</text>
  </g>

  <line x1="720" y1="270" x2="800" y2="270" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="755" y="260" fill="#B91C1C" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Inválido</text>

  <g filter="url(#shadow)">
    <rect x="800" y="240" width="160" height="60" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" rx="6"/>
    <text x="880" y="264" fill="#991B1B" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Feedback Instantâneo</text>
    <text x="880" y="283" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Toast de Erro / Sugestão Typo</text>
  </g>

  <line x1="500" y1="325" x2="500" y2="365" stroke="#4B6B50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="348" fill="#2E4A35" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Válido</text>

  <g filter="url(#shadow)">
    <polygon points="500,370 720,425 500,480 280,425" fill="#F4F8F4" stroke="#4A7C59" stroke-width="2"/>
    <text x="500" y="418" fill="#2E4A35" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3. Regras de Negócio</text>
    <text x="500" y="437" fill="#444444" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Bloqueio auto-troca, saldo de pontos,</text>
    <text x="500" y="452" fill="#444444" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">trava pós-rastreio Correios, exclusão</text>
  </g>

  <line x1="720" y1="425" x2="800" y2="425" stroke="#B91C1C" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="755" y="415" fill="#B91C1C" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Recusado</text>

  <g filter="url(#shadow)">
    <rect x="800" y="395" width="160" height="60" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" rx="6"/>
    <text x="880" y="420" fill="#991B1B" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bloqueio de Regra</text>
    <text x="880" y="439" fill="#7F1D1D" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Alerta de Violação</text>
  </g>

  <line x1="500" y1="480" x2="500" y2="520" stroke="#4B6B50" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="510" y="503" fill="#2E4A35" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Aprovado</text>

  <g filter="url(#shadow)">
    <rect x="250" y="525" width="500" height="65" fill="#2E4A35" stroke="#1E3324" stroke-width="2" rx="8"/>
    <text x="500" y="552" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">4. Persistência Segura e Atualização Otimista</text>
    <text x="500" y="572" fill="#D4EAD7" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Gravação no Cloud Firestore + Cache Local (bookCache) + Feedback</text>
  </g>
</svg>